[project]
name = "blabot"
version = "0.3.0"
description = "A sample project that communicates interactively with CLI process"
authors = [
    { name = "Nunoya Yuma", email = "nuno.yu.3838@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pexpect>=4.9.0",
    "pexpect_serial>=0.1.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-order>=1.3.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "types-pexpect>=4.9.0.20260408",
    "types-pyserial>=3.5.0.20260408",
    "yamllint>=1.38.0",
    "pre-commit>=4.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: Unit tests for individual classes and methods",
    "simple_process_test: Tests using ProcessIO against a local example app",
    "device_test: Tests using DeviceIO against a virtual serial device (requires socat)",
    "ssh_test: Tests using SSHProcessIO against a remote host (requires REMOTE_USER_NAME/REMOTE_HOST_NAME/REMOTE_KEY_PATH)",
    "docker_test: Tests using DockerRunIO/DockerExecIO from the host",
    "docker_inner_test: Tests run from inside a Docker container",
    "easy: Simple/fast test scenarios",
    "hard: Complex/slow test scenarios",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # trailing comma conflicts with formatter
    "CPY",      # this project does not use copyright header comments
    "D203",     # 1 blank line required before class docstring (conflicts with D211)
    "D213",     # multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "ANN", "D", "PLR2004"]        # allow assert, temp files, magic values, skip type annotations and docstrings in tests
"*/tests/*" = ["S101", "S108", "ANN", "D", "PLR2004"]      # allow assert, temp files, magic values, skip type annotations and docstrings in nested test directories
"examples/*" = ["S101", "S603", "S108", "ANN", "D"]  # allow assert, subprocess, temp files, skip type annotations and docstrings in example code
"blabot/docker_io.py" = ["S603"]  # allow subprocess for docker commands

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Gradually enable strict mode
disallow_any_generics = false  # Enable later
disallow_subclassing_any = false  # Enable later

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "examples.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pexpect_serial"
ignore_missing_imports = true
